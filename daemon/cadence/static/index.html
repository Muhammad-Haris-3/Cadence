<!doctype html>
<html lang="en" data-philosophy="editorial">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadence</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" id="theme-color" content="#0B0F19" />
<meta name="application-name" content="Cadence" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------------
     Two design philosophies, one stylesheet.

     Every structural difference between them is a variable, not a rule: a card
     is --surface + --radius + --shadow + --card-pad, and Editorial simply sets
     those to transparent / 0 / none / 0. So the markup and the CSS below are
     identical in both, and switching is one attribute on <html>.

       data-philosophy  editorial | studio
       data-mode        light     | dark

     Layout rules that hold in both: every table shares one column rhythm
     (fixed layout, explicit widths), every cell has the same side padding, and
     every control in the header is the same height.
     ------------------------------------------------------------------------ */

  :root,
  [data-philosophy="editorial"] {
    --bg:            #F5F5F4;
    --text:          #1C1917;
    --text-2:        #78716C;
    --border:        #E7E5E4;
    --gap-line:      var(--bg);       /* hairline between touching timeline blocks */
    --accent:        #1C1917;

    --surface:       transparent;
    --radius:        0;
    --control-radius: 4px;
    --shadow:        none;
    --card-pad:      0;
    --card-border:   none;
    --card-gap:      3.5rem;
    --icon-display:  none;
    --meter-height:  4px;
    --band-height:   42px;
    --band-radius:   2px;
    --chip-tint:     0%;
    --chip-pad:      0;
    --row-hover:     transparent;

    --display:       "Caveat", ui-serif, Georgia, serif;
    --body:          "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --mono:          "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --body-size:     14px;

    --h1-family:     var(--display);
    --h1-size:       2.75rem;
    --h1-weight:     600;
    --h1-spacing:    0;

    --h2-size:       .75rem;
    --h2-weight:     500;
    --h2-spacing:    .14em;
    --h2-transform:  uppercase;

    --lede-family:   var(--display);
    --lede-size:     1.6rem;
    --lede-weight:   400;

    --cat-code:        #4C4FA8;
    --cat-learning:    #2F8F87;
    --cat-docs:        #4F7CA8;
    --cat-design:      #8A5CA8;
    --cat-ai:          #7A6BA8;
    --cat-comms:       #B98B3E;
    --cat-distraction: #B5697E;
    --cat-browsing:    #7D8A97;
    --cat-other:       #A8A29E;
    --cat-idle:        #D6D3D1;
    --cat-away:        #D6D3D1;
  }

  [data-philosophy="editorial"][data-mode="dark"] {
    --bg:      #1C1917;
    --text:    #F5F5F4;
    --text-2:  #A8A29E;
    --border:  #292524;
    --accent:  #F5F5F4;

    --cat-code:        #8C8FE0;
    --cat-learning:    #5FC7BD;
    --cat-docs:        #8AB6E0;
    --cat-design:      #C093DC;
    --cat-ai:          #A99BDC;
    --cat-comms:       #E0B972;
    --cat-distraction: #E098AC;
    --cat-browsing:    #A8B4BF;
    --cat-other:       #78716C;
    --cat-idle:        #44403C;
    --cat-away:        #44403C;
  }

  /* Studio: calm cards, one sans-serif with tabular figures for numbers, and a
     softened category palette so the timeline reads as a day, not a flag. */
  [data-philosophy="studio"] {
    --bg:            #F4F6FA;
    --text:          #0F172A;
    --text-2:        #64748B;
    --border:        #E5E9F0;
    --gap-line:      var(--surface);
    --accent:        #5B5BD6;

    --surface:       #FFFFFF;
    --radius:        18px;
    --control-radius: 10px;
    --shadow:        0 1px 2px rgba(15, 23, 42, .04), 0 12px 32px -20px rgba(15, 23, 42, .25);
    --card-pad:      1.75rem 2rem;
    --card-border:   1px solid var(--border);
    --card-gap:      1.25rem;
    --icon-display:  block;
    --meter-height:  6px;
    --band-height:   48px;
    --band-radius:   8px;
    --chip-tint:     14%;
    --chip-pad:      .22rem .65rem .22rem .55rem;
    --row-hover:     rgba(15, 23, 42, .025);

    --display:       "Inter", system-ui, sans-serif;
    --body:          "Inter", system-ui, sans-serif;
    --mono:          "Inter", system-ui, sans-serif;
    --body-size:     14px;

    --h1-family:     var(--display);
    --h1-size:       1.75rem;
    --h1-weight:     700;
    --h1-spacing:    -.025em;

    --h2-size:       1rem;
    --h2-weight:     600;
    --h2-spacing:    -.01em;
    --h2-transform:  none;

    --lede-family:   var(--display);
    --lede-size:     1rem;
    --lede-weight:   400;

    --cat-code:        #5B5BD6;
    --cat-learning:    #12A594;
    --cat-docs:        #3B82C4;
    --cat-design:      #A855C7;
    --cat-ai:          #8B6FD6;
    --cat-comms:       #D29A2E;
    --cat-distraction: #E5566F;
    --cat-browsing:    #64748B;
    --cat-other:       #94A3B8;
    --cat-idle:        #E2E8F0;
    --cat-away:        #E2E8F0;
  }

  [data-philosophy="studio"][data-mode="dark"] {
    --bg:       #0B0F19;
    --text:     #E6EAF2;
    --text-2:   #8A94A8;
    --border:   #1C2333;
    --surface:  #111726;
    --accent:   #8B8DF5;
    --shadow:   0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -24px rgba(0, 0, 0, .9);
    --row-hover: rgba(255, 255, 255, .025);

    --cat-code:        #8B8DF5;
    --cat-learning:    #3CC7B4;
    --cat-docs:        #62A8E8;
    --cat-design:      #C88BE0;
    --cat-ai:          #A897F2;
    --cat-comms:       #E8B75A;
    --cat-distraction: #F07D92;
    --cat-browsing:    #8190A8;
    --cat-other:       #5E6A80;
    --cat-idle:        #1C2333;
    --cat-away:        #1C2333;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 3.5rem 1.5rem 6rem;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: var(--body-size);
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
  }

  main { max-width: 1040px; margin: 0 auto; }

  /* -- header ------------------------------------------------------------ */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem 1.5rem;
    flex-wrap: wrap;
    margin-bottom: .6rem;
  }

  h1 {
    font-family: var(--h1-family);
    font-size: var(--h1-size);
    font-weight: var(--h1-weight);
    letter-spacing: var(--h1-spacing);
    margin: 0;
    line-height: 1.1;
  }

  .controls { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }

  /* Every control group is the same pill: 2px inset, 32px buttons, 36px tall. */
  .segmented, .toolgroup {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 36px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: calc(var(--control-radius) + 2px);
    background: var(--surface);
  }

  .segmented button, .toolgroup button, .icon-button {
    font: inherit;
    font-family: var(--body);
    font-size: .8rem;
    font-weight: 500;
    height: 30px;
    background: none;
    border: none;
    color: var(--text-2);
    cursor: pointer;
    padding: 0 .75rem;
    border-radius: var(--control-radius);
    line-height: 1;
    transition: background-color .15s ease, color .15s ease;
  }
  .icon-button, .toolgroup .icon-button { width: 32px; padding: 0; display: inline-grid; place-items: center; text-decoration: none; }
  .segmented button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .segmented button:not([aria-pressed="true"]):hover,
  .toolgroup button:hover:not(:disabled),
  .icon-button:hover { color: var(--text); background: var(--border); }
  .toolgroup button:disabled { opacity: .3; cursor: default; }

  nav.toolgroup button { width: 32px; padding: 0; font-size: 1rem; }
  #day-label { min-width: 10ch; text-align: center; font-weight: 600; font-size: .85rem; color: var(--text); }

  .icon-button svg { width: 16px; height: 16px; display: block; stroke: currentColor; fill: none;
                     stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .lede {
    font-family: var(--lede-family);
    font-size: var(--lede-size);
    font-weight: var(--lede-weight);
    color: var(--text-2);
    margin: 0 0 2rem;
  }
  .lede strong { color: var(--text); font-weight: 600; }
  .lede .sep { margin: 0 .5rem; opacity: .5; }

  /* -- cards -------------------------------------------------------------- */

  section, .written {
    background: var(--surface);
    border: var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: var(--card-pad);
    margin-bottom: var(--card-gap);
  }

  h2 {
    font-size: var(--h2-size);
    font-weight: var(--h2-weight);
    letter-spacing: var(--h2-spacing);
    text-transform: var(--h2-transform);
    color: var(--text-2);
    margin: 0 0 1.25rem;
  }
  [data-philosophy="studio"] h2 { color: var(--text); }

  /* -- timeline ----------------------------------------------------------- */

  /* Faint gridlines every three hours, so a block can be placed by eye. */
  .timeline {
    position: relative;
    height: var(--band-height);
    border-radius: var(--band-radius);
    background-image: linear-gradient(to right, var(--border) 1px, transparent 1px);
    background-size: 12.5% 100%;
  }
  [data-philosophy="studio"] .timeline { background-color: color-mix(in srgb, var(--border) 55%, transparent); }
  .timeline .block {
    position: absolute;
    top: 0;
    height: 100%;
    border-radius: calc(var(--band-radius) - 2px);
    min-width: 3px;
    box-shadow: 0 0 0 2px var(--gap-line);  /* keeps neighbours from melting together */
    transition: filter .15s ease;
  }
  .timeline .block:hover { filter: brightness(1.12); }

  .hours { position: relative; height: 1.2rem; margin-top: .6rem; }
  .hours span { position: absolute; transform: translateX(-50%); font-size: .7rem; color: var(--text-2); }
  .hours span:first-child { transform: none; }
  .hours span:last-child { transform: translateX(-100%); }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin-top: 1.1rem; font-size: .78rem; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: .45rem; }
  .legend i { width: .6rem; height: .6rem; border-radius: 3px; }
  .legend b { color: var(--text); font-weight: 500; }

  /* -- tables ------------------------------------------------------------- */

  table { width: 100%; min-width: 640px; border-collapse: collapse; table-layout: fixed; }
  /* A narrow window scrolls the table inside its card, never the whole page. */
  section { overflow-x: auto; }

  td, th {
    padding: .8rem .9rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-weight: 400;
    vertical-align: middle;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  td:first-child, th:first-child { padding-left: 0; }
  td:last-child, th:last-child { padding-right: 0; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:not(.detail):hover td { background: var(--row-hover); }

  th {
    font-size: .68rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-2);
    padding-top: 0;
    padding-bottom: .7rem;
  }

  .num { text-align: right; font-family: var(--mono); }
  .muted { color: var(--text-2); }

  /* Category chip: a dot and a name, tinted in Studio, bare in Editorial. */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    max-width: 100%;
    padding: var(--chip-pad);
    border-radius: 99px;
    background: color-mix(in srgb, var(--c) var(--chip-tint), transparent);
    font-size: .8rem;
    line-height: 1.4;
  }
  .chip::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--c); flex: none; }

  /* Real application icons, extracted from the executables. Editorial keeps
     them hidden -- the category chip is enough there. */
  .appicon {
    display: var(--icon-display);
    width: 18px; height: 18px;
    border-radius: 4px;
    flex: none;
  }
  .with-icon { display: flex; align-items: center; gap: .65rem; min-width: 0; }
  .with-icon > .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .with-icon > .note, .with-icon > .chip { flex: none; }

  /* A meter and its number, laid out as a pair with room between them. */
  .score { display: flex; align-items: center; gap: .75rem; }
  .meter {
    flex: 1;
    height: var(--meter-height);
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .meter > i { display: block; height: 100%; border-radius: 99px; transition: width .3s ease; }
  .score > span { flex: none; width: 4.5ch; text-align: right; color: var(--text-2); font-family: var(--mono); }

  .note { color: var(--text-2); font-size: .78rem; }

  /* -- applications, and the story behind each one -------------------------- */

  tr.app > td { cursor: pointer; user-select: none; }
  tr.app:hover .label { color: var(--text); }

  .chev {
    flex: none;
    width: .8rem;
    color: var(--text-2);
    font-size: .6rem;
    transition: transform .18s ease;
  }
  tr.app[aria-expanded="true"] .chev { transform: rotate(90deg); }

  tr.detail > td { padding: 0; border-bottom: 1px solid var(--border); white-space: normal; }
  tr.detail[hidden] { display: none; }

  .visits {
    padding: .4rem 0 1rem 1.2rem;
    margin-left: .35rem;
    border-left: 1px solid var(--border);
  }

  .visit {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: .25rem 0;
    font-size: .82rem;
  }
  .visit .when { font-family: var(--mono); color: var(--text); white-space: nowrap; min-width: 10.5rem; }
  .visit .howlong { font-family: var(--mono); color: var(--text-2); white-space: nowrap; min-width: 4.5rem; }
  .visit .aside { color: var(--text-2); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* A break is drawn as absence: no rule, no marker, just indented space, so
     the eye reads the gap as the gap rather than as another entry. */
  .gap {
    padding: .1rem 0 .1rem 1.6rem;
    font-size: .76rem;
    color: var(--text-2);
    font-style: italic;
  }

  .empty { color: var(--text-2); font-family: var(--lede-family); font-size: 1.1rem; padding: 1rem 0; margin: 0; }

  /* -- written summary ----------------------------------------------------- */

  .written {
    max-width: 62ch;
    line-height: 1.9;
  }
  [data-philosophy="editorial"] .written {
    border-left: 2px solid var(--border);
    padding-left: 1.5rem;
  }
  .written .attrib {
    display: block;
    margin-top: 1rem;
    font-size: .7rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-2);
  }

  footer { color: var(--text-2); font-size: .75rem; margin-top: 3rem; line-height: 1.8; }

  /* Narrow windows: the "What" column carries the row, so the smaller columns give way. */
  @media (max-width: 720px) {
    body { padding: 2rem 1rem 4rem; }
    [data-philosophy="studio"] { --card-pad: 1.25rem; }
    .hours span:nth-child(even) { display: none; }   /* 12am 6am 12pm 6pm 12am */
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cadence</h1>
    <div class="controls">
      <div class="segmented" role="group" aria-label="Design philosophy">
        <button id="ph-editorial" aria-pressed="true">Editorial</button>
        <button id="ph-studio" aria-pressed="false">Studio</button>
      </div>
      <div class="toolgroup">
        <button class="icon-button" id="mode" title="Light or dark"></button>
        <a class="icon-button" id="download" download
           title="Download this day as a PDF" aria-label="Download this day as a PDF"></a>
        <a class="icon-button" id="download-week" download
           title="Download this week as a PDF" aria-label="Download this week as a PDF"></a>
      </div>
      <nav class="toolgroup">
        <button id="prev" title="Previous day">&larr;</button>
        <span id="day-label">&nbsp;</span>
        <button id="next" title="Next day">&rarr;</button>
      </nav>
    </div>
  </header>

  <p class="lede" id="lede">&nbsp;</p>
  <div id="content"></div>

  <footer>
    Window metadata only &mdash; no keystroke content, nothing leaves this machine.<br />
    Focus is a heuristic built from presence, engagement and continuity. It is not a measure of worth.
  </footer>
</main>

<script>
const POLL_MS = 20000;
const KNOWN = ["code", "learning", "docs", "design", "ai", "comms", "distraction", "browsing", "other", "idle", "away"];

const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const DOWNLOAD = '<svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>';
// A calendar rather than a second arrow: two identical download glyphs side by
// side would need their tooltips read to tell apart.
const WEEK = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>';

let currentDay = new URLSearchParams(location.search).get("day");
let timer = null;
let lastData = null;

// Which applications the reader has opened. Kept across the 20s poll, or every
// refresh would collapse whatever they were in the middle of reading.
const opened = new Set();

const el = (id) => document.getElementById(id);
const color = (c) => "var(--cat-" + (KNOWN.includes(c) ? c : "other") + ")";

/* -- theme ----------------------------------------------------------------- */

function store(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* private mode */ }
}

function restore(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
}

function applyPhilosophy(name) {
  document.documentElement.setAttribute("data-philosophy", name);
  el("ph-editorial").setAttribute("aria-pressed", String(name === "editorial"));
  el("ph-studio").setAttribute("aria-pressed", String(name === "studio"));
  store("cadence-philosophy", name);
  syncThemeColor();
}

function applyMode(mode) {
  document.documentElement.setAttribute("data-mode", mode);
  el("mode").innerHTML = mode === "dark" ? SUN : MOON;
  el("mode").title = mode === "dark" ? "Switch to light" : "Switch to dark";
  store("cadence-mode", mode);
  syncThemeColor();
}

// The installed app's title bar takes its colour from this meta tag, so it
// follows the page background instead of sitting on top of it in brand purple.
function syncThemeColor() {
  el("theme-color").content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
}

const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
applyPhilosophy(restore("cadence-philosophy", "editorial"));
applyMode(restore("cadence-mode", prefersDark ? "dark" : "light"));

el("ph-editorial").addEventListener("click", () => applyPhilosophy("editorial"));
el("ph-studio").addEventListener("click", () => applyPhilosophy("studio"));
el("mode").addEventListener("click", () => {
  applyMode(document.documentElement.getAttribute("data-mode") === "dark" ? "light" : "dark");
});

/* -- helpers --------------------------------------------------------------- */

function fmt(seconds) {
  const total = Math.round(seconds || 0);
  if (total < 60) return total + "s";
  const m = Math.floor(total / 60), s = total % 60;
  if (m < 60) return m + "m " + String(s).padStart(2, "0") + "s";
  return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";
}

// Twelve-hour, to match every other surface Cadence prints a time on. Storage
// stays 24-hour: it sorts, and it is never ambiguous. This is the reading end.
function clock(stamp) {
  const text = stamp ? stamp.slice(11, 16) : "";
  if (text.length !== 5 || text[2] !== ":") return text;
  const hour = Number(text.slice(0, 2));
  return (hour % 12 || 12) + ":" + text.slice(3) + (hour < 12 ? " am" : " pm");
}

// Tight enough on an axis that the space before am/pm is worth losing.
function hourLabel(hour) {
  return ((hour % 12) || 12) + ((hour % 24) < 12 ? "am" : "pm");
}

function pct(part, whole) {
  return whole > 0 ? Math.round((part / whole) * 100) : 0;
}

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text == null ? "" : text;
  return d.innerHTML;
}

function appIcon(app) {
  if (!app || app.startsWith("__")) return "";
  return '<img class="appicon" src="/api/icon?app=' + encodeURIComponent(app) +
    '" alt="" onerror="this.remove()" />';
}

function chip(category) {
  return '<span class="chip" style="--c:' + color(category) + '">' + esc(category) + "</span>";
}

// A meter and its number as one unit, so the two can never touch.
function score(value, text, fill) {
  return '<div class="score"><div class="meter"><i style="width:' + Math.min(Math.max(value, 0), 100) +
    "%;background:" + fill + '"></i></div><span>' + text + "</span></div>";
}

// Explicit widths, so the columns line up and stay put while the page polls.
function head(columns) {
  return "<colgroup>" + columns.map(function (c) {
    return c.width ? '<col style="width:' + c.width + '">' : "<col>";
  }).join("") + "</colgroup><thead><tr>" + columns.map(function (c) {
    return "<th" + (c.num ? ' class="num"' : "") + ">" + c.label + "</th>";
  }).join("") + "</tr></thead>";
}

function longDate(day) {
  const parts = day.split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2])
    .toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* -- sections -------------------------------------------------------------- */

function written(text, source) {
  if (!text) return "";
  const attrib = source === "api" ? "Written by Claude" : "Written by hand";
  return '<div class="written">' + esc(text) + '<span class="attrib">' + attrib + "</span></div>";
}

function timeline(sessions, categories) {
  if (!sessions.length) return "";

  // The band spans only the hours that were used, not all 24. A night of work
  // from midnight to five would otherwise fill a fifth of the band, every block
  // pressed against the next. At least six hours, so a short day isn't blown up.
  const first = Math.min.apply(null, sessions.map(function (s) { return s.offset_sec; }));
  const last = Math.max.apply(null, sessions.map(function (s) { return s.offset_sec + s.duration_sec; }));
  let from = Math.floor(first / 3600), to = Math.min(Math.ceil(last / 3600), 24);
  while (to - from < 6) {
    if (to < 24) to++;
    if (to - from < 6 && from > 0) from--;
  }
  const span = (to - from) * 3600;

  const blocks = sessions.map(function (s) {
    const left = ((s.offset_sec - from * 3600) / span) * 100;
    const width = Math.max((s.duration_sec / span) * 100, 0.3);
    const label = s.category + " · " + fmt(s.duration_sec) + " · " + (s.top_title || s.top_app);
    return '<div class="block" style="left:' + left + "%;width:" + width + "%;background:" +
      color(s.category) + '" title="' + esc(label) + '"></div>';
  }).join("");

  // One label per hour, or per two hours on a long day so labels keep their distance.
  const step = to - from <= 12 ? 1 : 2;
  const marks = [];
  for (let h = from; h <= to; h += step) marks.push(h);
  if (marks[marks.length - 1] !== to) {
    if (to - marks[marks.length - 1] < step) marks.pop();   // or the last two labels touch
    marks.push(to);
  }
  const hours = marks.map(function (h) {
    return '<span style="left:' + (((h - from) / (to - from)) * 100) + '%">' + hourLabel(h) + "</span>";
  }).join("");
  const grid = "background-size:" + (100 / (to - from)) + "% 100%";

  // The colours only mean something with a key beside them. Totals come from
  // segments, so a category done in short bursts inside another session counts.
  const totals = {};
  categories.forEach(function (c) { totals[c.category] = c.duration_sec; });
  const legend = Object.keys(totals)
    .filter(function (c) { return c !== "idle" && c !== "away"; })
    .sort(function (a, b) { return totals[b] - totals[a]; })
    .map(function (c) {
      return '<span><i style="background:' + color(c) + '"></i>' + esc(c) + " <b>" + fmt(totals[c]) + "</b></span>";
    }).join("");

  return '<section><h2>The day</h2><div class="timeline" style="' + grid + '">' + blocks +
    '</div><div class="hours">' + hours + '</div><div class="legend">' + legend + "</div></section>";
}

function sessionTable(sessions) {
  if (!sessions.length) {
    return '<section><h2>Sessions</h2><p class="empty">Nothing long enough to call a session yet.</p></section>';
  }

  const rows = sessions.map(function (s) {
    const interruptions = s.interruptions
      ? '<span class="note">+' + s.interruptions + " interruption" + (s.interruptions > 1 ? "s" : "") + "</span>"
      : "";
    return "<tr>" +
      '<td class="num muted">' + clock(s.start) + "</td>" +
      '<td class="num">' + fmt(s.duration_sec) + "</td>" +
      "<td>" + score(s.focus_score, Math.round(s.focus_score), "var(--accent)") + "</td>" +
      "<td>" + chip(s.category) + "</td>" +
      '<td><span class="with-icon">' + appIcon(s.top_app) +
        '<span class="label">' + esc(s.top_title || s.top_app) + "</span>" + interruptions + "</span></td>" +
      "</tr>";
  }).join("");

  return "<section><h2>Sessions</h2><table>" +
    head([
      { label: "Start", num: true, width: "92px" },
      { label: "Length", num: true, width: "100px" },
      { label: "Focus", width: "180px" },
      { label: "Category", width: "150px" },
      { label: "What" },
    ]) + "<tbody>" + rows + "</tbody></table></section>";
}

function categoryTable(categories) {
  const real = categories.filter(function (c) {
    return c.category && c.category !== "idle" && c.category !== "away";
  });
  if (!real.length) return "";

  const rows = real.map(function (c) {
    const engagement = pct(c.input_sec, c.duration_sec);
    return "<tr>" +
      "<td>" + chip(c.category) + "</td>" +
      '<td class="num">' + fmt(c.duration_sec) + "</td>" +
      '<td class="num muted">' + fmt(c.input_sec) + "</td>" +
      "<td>" + score(engagement, engagement + "%", color(c.category)) + "</td>" +
      "</tr>";
  }).join("");

  return "<section><h2>Where the time went</h2><table>" +
    head([
      { label: "Category" },
      { label: "Open", num: true, width: "110px" },
      { label: "Engaged", num: true, width: "110px" },
      { label: "Engagement", width: "240px" },
    ]) + "<tbody>" + rows + "</tbody></table></section>";
}

function visitList(a) {
  const parts = a.visits.map(function (v) {
    const gap = v.break_sec
      ? '<div class="gap">away ' + fmt(v.break_sec) + "</div>"
      : "";

    // A merged visit absorbed brief excursions, so its span is longer than the
    // time actually spent in it. Saying so is better than quietly disagreeing
    // with the arithmetic the reader is doing in their head.
    const aside = v.away_sec >= 60
      ? '<span class="aside">' + fmt(v.away_sec) + " elsewhere in between</span>"
      : v.title && v.title !== a.name
        ? '<span class="aside">' + esc(v.title) + "</span>"
        : "";

    return gap +
      '<div class="visit">' +
        '<span class="when">' + clock(v.start) + " &ndash; " + (clock(v.end) || "now") + "</span>" +
        '<span class="howlong">' + fmt(v.duration_sec) + "</span>" +
        aside +
      "</div>";
  }).join("");

  return '<div class="visits">' + parts + "</div>";
}

function appTable(apps) {
  const real = apps.filter(function (a) { return !a.app.startsWith("__"); });
  if (!real.length) return "";

  const rows = real.map(function (a) {
    const open = opened.has(a.app);
    const visits = a.visits.length;
    const engaged = pct(a.input_sec, a.duration_sec);

    return '<tr class="app" data-app="' + esc(a.app) + '" aria-expanded="' + open + '">' +
        '<td><span class="with-icon">' +
          '<span class="chev">&#9654;</span>' +
          appIcon(a.app) +
          '<span class="label">' + esc(a.name) + "</span>" + chip(a.category) + "</span></td>" +
        '<td class="num">' + fmt(a.duration_sec) + "</td>" +
        '<td class="num muted">' + visits + (visits > 1 ? " visits" : " visit") + "</td>" +
        '<td class="num muted">' + clock(a.first_seen) + " &ndash; " + (clock(a.last_seen) || "now") + "</td>" +
        '<td class="num muted">' + engaged + "%</td>" +
      "</tr>" +
      '<tr class="detail" data-detail="' + esc(a.app) + '"' + (open ? "" : " hidden") + ">" +
        '<td colspan="5">' + visitList(a) + "</td>" +
      "</tr>";
  }).join("");

  return "<section><h2>Applications</h2><table>" +
    head([
      { label: "Application" },
      { label: "Total", num: true, width: "110px" },
      { label: "Picked up", num: true, width: "110px" },
      { label: "Between", num: true, width: "180px" },
      { label: "Engaged", num: true, width: "90px" },
    ]) + "<tbody>" + rows + "</tbody></table></section>";
}

function listTable(title, items, label, icon) {
  if (!items.length) return "";

  const rows = items.map(function (i) {
    const art = icon ? appIcon(i.app) : "";
    return "<tr>" +
      '<td><span class="with-icon">' + art +
        '<span class="label">' + esc(label(i)) + "</span></span></td>" +
      '<td class="num">' + fmt(i.duration_sec) + "</td>" +
      '<td class="num muted">' + pct(i.input_sec, i.duration_sec) + "%</td>" +
      "</tr>";
  }).join("");

  return "<section><h2>" + title + "</h2><table>" +
    head([
      { label: "Site" },
      { label: "Open", num: true, width: "110px" },
      { label: "Engaged", num: true, width: "90px" },
    ]) + "<tbody>" + rows + "</tbody></table></section>";
}

/* -- render ---------------------------------------------------------------- */

function render(data) {
  lastData = data;
  currentDay = data.day;
  el("day-label").textContent = data.is_today ? "Today" : longDate(data.day);

  // Pointed at the day on screen, not at today: the arrows are how you reach a
  // day worth sending, and the file that arrives should be the one you were
  // looking at when you clicked.
  el("download").href = "/api/day/" + data.day + "/pdf";
  el("download").setAttribute("download", "cadence-" + data.day + ".pdf");
  // Any day in the week identifies the week; the server works out the Monday,
  // and names the file after it in the Content-Disposition header.
  el("download-week").href = "/api/week/" + data.day + "/pdf";
  el("next").disabled = data.is_today;

  const s = data.summary;
  el("lede").innerHTML = s.sessions
    ? "<strong>" + s.sessions + "</strong> session" + (s.sessions > 1 ? "s" : "") +
      '<span class="sep">&middot;</span><strong>' + fmt(s.blocks_sec) + "</strong> in blocks" +
      '<span class="sep">&middot;</span>longest <strong>' + fmt(s.longest_sec) + "</strong>"
    : "Nothing tracked on this day.";

  el("content").innerHTML =
    written(data.written, data.written_source) +
    timeline(data.sessions, data.categories) +
    sessionTable(data.sessions) +
    categoryTable(data.categories) +
    appTable(data.apps) +
    listTable("Top sites", data.sites, function (x) { return x.host; }, false);

  history.replaceState(null, "", "?day=" + data.day);

  clearTimeout(timer);
  if (data.is_today) timer = setTimeout(function () { load(currentDay); }, POLL_MS);
}

async function load(day) {
  // Fetching and rendering are caught separately, because for one evening they
  // were not. A rendering bug in this file threw, the single catch below
  // reported it as "waiting for the tracker", and the tracker was running fine
  // the whole time -- the page accused the daemon of its own crash, and the
  // retry rethrew every five seconds forever. A message this reassuring has to
  // be earned: it may only be shown when the fetch itself failed.
  let data;
  try {
    let target = day;
    if (!target) {
      const days = await (await fetch("/api/days")).json();
      target = days.today;
    }
    data = await (await fetch("/api/day/" + target)).json();
  } catch (err) {
    // The page itself came from the service worker cache, which is why you are
    // reading this instead of a browser connection error.
    //
    // The wording is careful. This screen is what you get in the seconds after
    // logon before the tracker has started, and the version that said only
    // "can't reach the tracker" read as though the day had been lost -- it was
    // reported three times as "it lost everything" when nothing had been lost
    // at all. The database is only ever appended to; a tracker that is not
    // running records nothing new and destroys nothing old. Say that first.
    el("lede").textContent =
      "Waiting for the tracker. Nothing is lost — everything already recorded " +
      "is safe on this machine, and this page fills in by itself the moment " +
      "the tracker answers. It starts on its own shortly after you log in.";
    clearTimeout(timer);
    timer = setTimeout(function () { load(day); }, 5000);
    return;
  }

  try {
    render(data);
  } catch (err) {
    // The data arrived; we could not draw it. Say that, and say where to look,
    // rather than blaming the daemon that just answered.
    el("lede").textContent =
      "The tracker answered, but this page could not draw the result: " +
      err.message + " — the recording is unaffected.";
    throw err;   // and leave it in the console, with a stack
  }
}

function shift(days) {
  const parts = currentDay.split("-").map(Number);
  const moved = new Date(parts[0], parts[1] - 1, parts[2] + days);
  const iso = moved.getFullYear() + "-" +
    String(moved.getMonth() + 1).padStart(2, "0") + "-" +
    String(moved.getDate()).padStart(2, "0");
  load(iso);
}

// Delegated, because the table is rebuilt from scratch on every poll.
el("content").addEventListener("click", function (e) {
  const row = e.target.closest("tr.app");
  if (!row) return;

  const app = row.dataset.app;
  const isOpen = opened.has(app);
  if (isOpen) opened.delete(app); else opened.add(app);

  row.setAttribute("aria-expanded", String(!isOpen));
  const detail = el("content").querySelector('tr.detail[data-detail="' + CSS.escape(app) + '"]');
  if (detail) detail.hidden = isOpen;
});

el("prev").addEventListener("click", function () { shift(-1); });
el("next").addEventListener("click", function () { shift(1); });
document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "BUTTON") return;
  if (e.key === "ArrowLeft") shift(-1);
  if (e.key === "ArrowRight" && !el("next").disabled) shift(1);
});

el("download").innerHTML = DOWNLOAD;
el("download-week").innerHTML = WEEK;

load(currentDay);

// Registered so Chrome offers "Install app", which is what makes the dashboard
// pinnable to the taskbar with its own window and icon.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () { /* not fatal */ });
  });
}
</script>
</body>
</html>
