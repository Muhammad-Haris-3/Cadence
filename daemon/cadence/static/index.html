<!doctype html>
<html lang="en" data-philosophy="editorial">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadence</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#4C4FA8" />
<meta name="application-name" content="Cadence" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------------
     Two design philosophies, one stylesheet.

     Every structural difference between them is a variable, not a rule: a card
     is --surface + --radius + --shadow + --card-pad, and Editorial simply sets
     those to transparent / 0 / none / 0. So the markup and the CSS below are
     identical in both, and switching is one attribute on <html>.

       data-philosophy  editorial | studio
       data-mode        light     | dark
     ------------------------------------------------------------------------ */

  :root,
  [data-philosophy="editorial"] {
    --bg:            #F5F5F4;
    --text:          #1C1917;
    --text-2:        #78716C;
    --border:        #E7E5E4;

    --surface:       transparent;
    --radius:        0;
    --shadow:        none;
    --card-pad:      0;
    --card-border:   none;
    --card-gap:      3.5rem;
    --icon-display:  none;
    --meter-height:  4px;
    --band-height:   42px;
    --band-radius:   2px;

    --display:       "Caveat", ui-serif, Georgia, serif;
    --body:          "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --mono:          "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --body-size:     14px;

    --h1-family:     var(--display);
    --h1-size:       2.75rem;
    --h1-weight:     600;
    --h1-spacing:    0;

    --h2-size:       .75rem;
    --h2-weight:     500;
    --h2-spacing:    .14em;
    --h2-transform:  uppercase;

    --lede-family:   var(--display);
    --lede-size:     1.6rem;
    --lede-weight:   400;

    --cat-code:        #4C4FA8;
    --cat-learning:    #2F8F87;
    --cat-docs:        #4F7CA8;
    --cat-design:      #8A5CA8;
    --cat-ai:          #7A6BA8;
    --cat-comms:       #B98B3E;
    --cat-distraction: #B5697E;
    --cat-browsing:    #7D8A97;
    --cat-other:       #A8A29E;
    --cat-idle:        #D6D3D1;
    --cat-away:        #D6D3D1;
  }

  [data-philosophy="editorial"][data-mode="dark"] {
    --bg:      #1C1917;
    --text:    #F5F5F4;
    --text-2:  #A8A29E;
    --border:  #292524;

    --cat-code:        #8C8FE0;
    --cat-learning:    #5FC7BD;
    --cat-docs:        #8AB6E0;
    --cat-design:      #C093DC;
    --cat-ai:          #A99BDC;
    --cat-comms:       #E0B972;
    --cat-distraction: #E098AC;
    --cat-browsing:    #A8B4BF;
    --cat-other:       #78716C;
    --cat-idle:        #44403C;
    --cat-away:        #44403C;
  }

  [data-philosophy="studio"] {
    --bg:            #EEF2F7;
    --text:          #0F172A;
    --text-2:        #64748B;
    --border:        #E2E8F0;

    --surface:       #FFFFFF;
    --radius:        14px;
    --shadow:        0 1px 2px rgba(15, 23, 42, .05), 0 10px 30px -18px rgba(15, 23, 42, .35);
    --card-pad:      1.6rem 1.7rem;
    --card-border:   1px solid var(--border);
    --card-gap:      1.5rem;
    --icon-display:  block;
    --meter-height:  7px;
    --band-height:   54px;
    --band-radius:   6px;

    --display:       "Inter", system-ui, sans-serif;
    --body:          "Inter", system-ui, sans-serif;
    --mono:          "IBM Plex Mono", ui-monospace, monospace;
    --body-size:     14px;

    --h1-family:     var(--display);
    --h1-size:       1.7rem;
    --h1-weight:     700;
    --h1-spacing:    -.02em;

    --h2-size:       .95rem;
    --h2-weight:     600;
    --h2-spacing:    0;
    --h2-transform:  none;

    --lede-family:   var(--display);
    --lede-size:     1.05rem;
    --lede-weight:   500;

    --cat-code:        #4F46E5;
    --cat-learning:    #0D9488;
    --cat-docs:        #0284C7;
    --cat-design:      #9333EA;
    --cat-ai:          #7C3AED;
    --cat-comms:       #D97706;
    --cat-distraction: #E11D48;
    --cat-browsing:    #475569;
    --cat-other:       #94A3B8;
    --cat-idle:        #CBD5E1;
    --cat-away:        #CBD5E1;
  }

  [data-philosophy="studio"][data-mode="dark"] {
    --bg:       #0B1120;
    --text:     #E2E8F0;
    --text-2:   #94A3B8;
    --border:   #1E293B;
    --surface:  #131C31;
    --shadow:   0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -18px rgba(0, 0, 0, .8);

    --cat-code:        #818CF8;
    --cat-learning:    #2DD4BF;
    --cat-docs:        #38BDF8;
    --cat-design:      #C084FC;
    --cat-ai:          #A78BFA;
    --cat-comms:       #FBBF24;
    --cat-distraction: #FB7185;
    --cat-browsing:    #94A3B8;
    --cat-other:       #64748B;
    --cat-idle:        #1E293B;
    --cat-away:        #1E293B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 4rem 1.5rem 6rem;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: var(--body-size);
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
    transition: background-color .25s ease, color .25s ease;
  }

  main { max-width: 1080px; margin: 0 auto; }

  /* -- header ------------------------------------------------------------ */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-bottom: .75rem;
  }

  h1 {
    font-family: var(--h1-family);
    font-size: var(--h1-size);
    font-weight: var(--h1-weight);
    letter-spacing: var(--h1-spacing);
    margin: 0;
    line-height: 1.1;
  }

  .controls { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }

  nav { display: flex; align-items: center; gap: .75rem; }

  nav button, .icon-button {
    font: inherit;
    font-family: var(--body);
    background: none;
    border: none;
    color: var(--text-2);
    cursor: pointer;
    padding: .3rem .55rem;
    border-radius: 6px;
    line-height: 1;
  }
  nav button:hover:not(:disabled), .icon-button:hover { color: var(--text); background: var(--border); }
  nav button:disabled { opacity: .25; cursor: default; }

  #day-label { min-width: 11ch; text-align: center; font-weight: 500; color: var(--text); }

  /* The segmented switch borrows --radius, so it is a square block in
     Editorial and a pill in Studio without a second rule. */
  .segmented {
    display: flex;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) / 2 + 4px);
    background: var(--surface);
  }
  .segmented button {
    font: inherit;
    font-family: var(--body);
    font-size: .78rem;
    background: none;
    border: none;
    color: var(--text-2);
    cursor: pointer;
    padding: .3rem .7rem;
    border-radius: calc(var(--radius) / 2 + 2px);
  }
  .segmented button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .segmented button:not([aria-pressed="true"]):hover { color: var(--text); }

  a.icon-button { display: inline-flex; text-decoration: none; }

  .icon-button svg { width: 16px; height: 16px; display: block; stroke: currentColor; fill: none;
                     stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .lede {
    font-family: var(--lede-family);
    font-size: var(--lede-size);
    font-weight: var(--lede-weight);
    color: var(--text-2);
    margin: 0 0 2.5rem;
  }
  .lede strong { color: var(--text); font-weight: 600; }

  /* -- cards -------------------------------------------------------------- */

  section, .written {
    background: var(--surface);
    border: var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: var(--card-pad);
    margin-bottom: var(--card-gap);
  }

  h2 {
    font-size: var(--h2-size);
    font-weight: var(--h2-weight);
    letter-spacing: var(--h2-spacing);
    text-transform: var(--h2-transform);
    color: var(--text-2);
    margin: 0 0 1.25rem;
  }
  [data-philosophy="studio"] h2 { color: var(--text); }

  /* -- timeline ----------------------------------------------------------- */

  .timeline { position: relative; height: var(--band-height); }
  .timeline .block {
    position: absolute;
    top: 0;
    height: var(--band-height);
    border-radius: var(--band-radius);
    min-width: 2px;
    transition: height .25s ease, border-radius .25s ease;
  }
  [data-philosophy="studio"] .timeline { background: var(--border); border-radius: var(--band-radius); }

  .hours { position: relative; height: 1.4rem; margin-top: .5rem; }
  .hours span { position: absolute; transform: translateX(-50%); font-size: .7rem; color: var(--text-2); }

  /* -- tables ------------------------------------------------------------- */

  table { width: 100%; border-collapse: collapse; }

  td, th {
    padding: .6rem 0;
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-weight: 400;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }

  th {
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-2);
    padding-bottom: .5rem;
  }

  .num { text-align: right; font-family: var(--mono); white-space: nowrap; }
  .muted { color: var(--text-2); }
  .truncate { max-width: 1px; width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .dot {
    display: inline-block;
    width: .55rem; height: .55rem;
    border-radius: 50%;
    margin-right: .55rem;
    flex: none;
  }

  /* Real application icons, extracted from the executables. Editorial keeps
     them hidden -- the category dot is enough there. */
  .appicon {
    display: var(--icon-display);
    width: 18px; height: 18px;
    border-radius: 4px;
    margin-right: .6rem;
    flex: none;
  }
  .with-icon { display: flex; align-items: center; min-width: 0; }
  .with-icon > span.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .meter {
    display: inline-block;
    width: 110px;
    height: var(--meter-height);
    background: var(--border);
    border-radius: 99px;
    vertical-align: middle;
    overflow: hidden;
  }
  .meter > i { display: block; height: 100%; border-radius: 99px; transition: width .3s ease; }

  .note { color: var(--text-2); font-size: .8rem; }

  /* -- applications, and the story behind each one -------------------------- */

  tr.app > td { cursor: pointer; user-select: none; }
  tr.app:hover .label { color: var(--text); }

  .chev {
    flex: none;
    width: .8rem;
    margin-right: .35rem;
    color: var(--text-2);
    font-size: .65rem;
    transition: transform .18s ease;
  }
  tr.app[aria-expanded="true"] .chev { transform: rotate(90deg); }

  tr.detail > td { padding: 0; border-bottom: 1px solid var(--border); }
  tr.detail[hidden] { display: none; }

  .visits {
    padding: .5rem 0 .9rem 1.15rem;
    margin-left: .25rem;
    border-left: 1px solid var(--border);
  }

  .visit {
    display: flex;
    align-items: baseline;
    gap: .75rem;
    padding: .22rem 0;
    font-size: .82rem;
  }
  .visit .when { font-family: var(--mono); color: var(--text); white-space: nowrap; }
  .visit .howlong { font-family: var(--mono); color: var(--text-2); white-space: nowrap; }
  .visit .aside { color: var(--text-2); font-size: .78rem; }

  /* A break is drawn as absence: no rule, no marker, just indented space, so
     the eye reads the gap as the gap rather than as another entry. */
  .gap {
    padding: .1rem 0 .1rem 1.6rem;
    font-size: .76rem;
    color: var(--text-2);
    font-style: italic;
  }

  .empty { color: var(--text-2); font-family: var(--lede-family); font-size: 1.2rem; padding: 1.5rem 0; }

  /* -- written summary ----------------------------------------------------- */

  .written {
    max-width: 62ch;
    line-height: 1.9;
  }
  [data-philosophy="editorial"] .written {
    border-left: 2px solid var(--border);
    padding-left: 1.5rem;
  }
  .written .attrib {
    display: block;
    margin-top: 1rem;
    font-size: .7rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-2);
  }

  footer { color: var(--text-2); font-size: .75rem; margin-top: 3rem; line-height: 1.8; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cadence</h1>
    <div class="controls">
      <div class="segmented" role="group" aria-label="Design philosophy">
        <button id="ph-editorial" aria-pressed="true">Editorial</button>
        <button id="ph-studio" aria-pressed="false">Studio</button>
      </div>
      <button class="icon-button" id="mode" title="Light or dark"></button>
      <a class="icon-button" id="download" download
         title="Download this day as a PDF" aria-label="Download this day as a PDF"></a>
      <a class="icon-button" id="download-week" download
         title="Download this week as a PDF" aria-label="Download this week as a PDF"></a>
      <nav>
        <button id="prev" title="Previous day">&larr;</button>
        <span id="day-label">&nbsp;</span>
        <button id="next" title="Next day">&rarr;</button>
      </nav>
    </div>
  </header>

  <p class="lede" id="lede">&nbsp;</p>
  <div id="content"></div>

  <footer>
    Window metadata only &mdash; no keystroke content, nothing leaves this machine.<br />
    Focus is a heuristic built from presence, engagement and continuity. It is not a measure of worth.
  </footer>
</main>

<script>
const POLL_MS = 20000;
const KNOWN = ["code", "learning", "docs", "design", "ai", "comms", "distraction", "browsing", "other", "idle", "away"];

const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const DOWNLOAD = '<svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>';
// A calendar rather than a second arrow: two identical download glyphs side by
// side would need their tooltips read to tell apart.
const WEEK = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>';

let currentDay = new URLSearchParams(location.search).get("day");
let timer = null;
let lastData = null;

// Which applications the reader has opened. Kept across the 20s poll, or every
// refresh would collapse whatever they were in the middle of reading.
const opened = new Set();

const el = (id) => document.getElementById(id);
const color = (c) => "var(--cat-" + (KNOWN.includes(c) ? c : "other") + ")";

/* -- theme ----------------------------------------------------------------- */

function store(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* private mode */ }
}

function restore(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
}

function applyPhilosophy(name) {
  document.documentElement.setAttribute("data-philosophy", name);
  el("ph-editorial").setAttribute("aria-pressed", String(name === "editorial"));
  el("ph-studio").setAttribute("aria-pressed", String(name === "studio"));
  store("cadence-philosophy", name);
}

function applyMode(mode) {
  document.documentElement.setAttribute("data-mode", mode);
  el("mode").innerHTML = mode === "dark" ? SUN : MOON;
  el("mode").title = mode === "dark" ? "Switch to light" : "Switch to dark";
  store("cadence-mode", mode);
}

const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
applyPhilosophy(restore("cadence-philosophy", "editorial"));
applyMode(restore("cadence-mode", prefersDark ? "dark" : "light"));

el("ph-editorial").addEventListener("click", () => applyPhilosophy("editorial"));
el("ph-studio").addEventListener("click", () => applyPhilosophy("studio"));
el("mode").addEventListener("click", () => {
  applyMode(document.documentElement.getAttribute("data-mode") === "dark" ? "light" : "dark");
});

/* -- helpers --------------------------------------------------------------- */

function fmt(seconds) {
  const total = Math.round(seconds || 0);
  if (total < 60) return total + "s";
  const m = Math.floor(total / 60), s = total % 60;
  if (m < 60) return m + "m " + String(s).padStart(2, "0") + "s";
  return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";
}

// Twelve-hour, to match every other surface Cadence prints a time on. Storage
// stays 24-hour: it sorts, and it is never ambiguous. This is the reading end.
function clock(stamp) {
  const text = stamp ? stamp.slice(11, 16) : "";
  if (text.length !== 5 || text[2] !== ":") return text;
  const hour = Number(text.slice(0, 2));
  return (hour % 12 || 12) + ":" + text.slice(3) + (hour < 12 ? " am" : " pm");
}

// Tight enough on an axis that the space before am/pm is worth losing.
function hourLabel(hour) {
  return ((hour % 12) || 12) + ((hour % 24) < 12 ? "am" : "pm");
}

function pct(part, whole) {
  return whole > 0 ? Math.round((part / whole) * 100) : 0;
}

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text == null ? "" : text;
  return d.innerHTML;
}

function appIcon(app) {
  if (!app || app.startsWith("__")) return "";
  return '<img class="appicon" src="/api/icon?app=' + encodeURIComponent(app) +
    '" alt="" onerror="this.remove()" />';
}

function longDate(day) {
  const parts = day.split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2])
    .toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* -- sections -------------------------------------------------------------- */

function written(text, source) {
  if (!text) return "";
  const attrib = source === "api" ? "Written by Claude" : "Written by hand";
  return '<div class="written">' + esc(text) + '<span class="attrib">' + attrib + "</span></div>";
}

function timeline(sessions) {
  if (!sessions.length) return "";

  const blocks = sessions.map(function (s) {
    const left = (s.offset_sec / 86400) * 100;
    const width = Math.max((s.duration_sec / 86400) * 100, 0.15);
    const label = s.category + " · " + fmt(s.duration_sec) + " · " + (s.top_title || s.top_app);
    return '<div class="block" style="left:' + left + "%;width:" + width + "%;background:" +
      color(s.category) + '" title="' + esc(label) + '"></div>';
  }).join("");

  const hours = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(function (h) {
    return '<span style="left:' + ((h / 24) * 100) + '%">' + hourLabel(h) + "</span>";
  }).join("");

  return '<section><h2>The day</h2><div class="timeline">' + blocks +
    '</div><div class="hours">' + hours + "</div></section>";
}

function sessionTable(sessions) {
  if (!sessions.length) {
    return '<section><h2>Sessions</h2><p class="empty">Nothing long enough to call a session yet.</p></section>';
  }

  const rows = sessions.map(function (s) {
    const interruptions = s.interruptions
      ? '<span class="note">+' + s.interruptions + " interruption" + (s.interruptions > 1 ? "s" : "") + "</span>"
      : "";
    return "<tr>" +
      '<td class="num muted">' + clock(s.start) + "</td>" +
      '<td class="num">' + fmt(s.duration_sec) + "</td>" +
      '<td class="num" style="width:170px"><span class="meter"><i style="width:' +
        Math.min(s.focus_score, 100) + "%;background:" + color(s.category) +
        '"></i></span><span class="muted" style="margin-left:.6rem">' + Math.round(s.focus_score) + "</span></td>" +
      '<td><span class="dot" style="background:' + color(s.category) + '"></span>' + esc(s.category) + "</td>" +
      '<td class="truncate"><span class="with-icon">' + appIcon(s.top_app) +
        '<span class="label">' + esc(s.top_title || s.top_app) + " " + interruptions + "</span></span></td>" +
      "</tr>";
  }).join("");

  return "<section><h2>Sessions</h2><table>" +
    '<tr><th class="num">Start</th><th class="num">Length</th><th class="num">Focus</th><th>Category</th><th>What</th></tr>' +
    rows + "</table></section>";
}

function categoryTable(categories) {
  const real = categories.filter(function (c) {
    return c.category && c.category !== "idle" && c.category !== "away";
  });
  if (!real.length) return "";

  const rows = real.map(function (c) {
    const engagement = pct(c.input_sec, c.duration_sec);
    return "<tr>" +
      '<td><span class="dot" style="background:' + color(c.category) + '"></span>' + esc(c.category) + "</td>" +
      '<td class="num">' + fmt(c.duration_sec) + "</td>" +
      '<td class="num muted">' + fmt(c.input_sec) + "</td>" +
      '<td class="num" style="width:170px"><span class="meter"><i style="width:' + engagement +
        "%;background:" + color(c.category) + '"></i></span><span class="muted" style="margin-left:.6rem">' +
        engagement + "%</span></td>" +
      "</tr>";
  }).join("");

  return "<section><h2>Where the time went</h2><table>" +
    '<tr><th>Category</th><th class="num">Open</th><th class="num">Engaged</th><th class="num">Engagement</th></tr>' +
    rows + "</table></section>";
}

function visitList(a) {
  const parts = a.visits.map(function (v) {
    const gap = v.break_sec
      ? '<div class="gap">away ' + fmt(v.break_sec) + "</div>"
      : "";

    // A merged visit absorbed brief excursions, so its span is longer than the
    // time actually spent in it. Saying so is better than quietly disagreeing
    // with the arithmetic the reader is doing in their head.
    const aside = v.away_sec >= 60
      ? '<span class="aside">' + fmt(v.away_sec) + " elsewhere in between</span>"
      : v.title && v.title !== a.name
        ? '<span class="aside">' + esc(v.title) + "</span>"
        : "";

    return gap +
      '<div class="visit">' +
        '<span class="when">' + clock(v.start) + " &ndash; " + (clock(v.end) || "now") + "</span>" +
        '<span class="howlong">' + fmt(v.duration_sec) + "</span>" +
        aside +
      "</div>";
  }).join("");

  return '<div class="visits">' + parts + "</div>";
}

function appTable(apps) {
  const real = apps.filter(function (a) { return !a.app.startsWith("__"); });
  if (!real.length) return "";

  const rows = real.map(function (a) {
    const open = opened.has(a.app);
    const visits = a.visits.length;
    const engaged = pct(a.input_sec, a.duration_sec);

    return '<tr class="app" data-app="' + esc(a.app) + '" aria-expanded="' + open + '">' +
        '<td class="truncate"><span class="with-icon">' +
          '<span class="chev">&#9654;</span>' +
          '<span class="dot" style="background:' + color(a.category) + '"></span>' +
          appIcon(a.app) +
          '<span class="label">' + esc(a.name) + "</span></span></td>" +
        '<td class="num">' + fmt(a.duration_sec) + "</td>" +
        '<td class="num muted">' + visits + (visits > 1 ? " visits" : " visit") + "</td>" +
        '<td class="num muted">' + clock(a.first_seen) + " &ndash; " + (clock(a.last_seen) || "now") + "</td>" +
        '<td class="num muted">' + engaged + "%</td>" +
      "</tr>" +
      '<tr class="detail" data-detail="' + esc(a.app) + '"' + (open ? "" : " hidden") + ">" +
        '<td colspan="5">' + visitList(a) + "</td>" +
      "</tr>";
  }).join("");

  return "<section><h2>Applications</h2><table>" +
    '<tr><th></th><th class="num">Total</th><th class="num">Picked up</th>' +
    '<th class="num">Between</th><th class="num">Engaged</th></tr>' +
    rows + "</table></section>";
}

function listTable(title, items, label, icon) {
  if (!items.length) return "";

  const rows = items.map(function (i) {
    const art = icon ? appIcon(i.app) : "";
    return "<tr>" +
      '<td class="truncate"><span class="with-icon">' + art +
        '<span class="label">' + esc(label(i)) + "</span></span></td>" +
      '<td class="num">' + fmt(i.duration_sec) + "</td>" +
      '<td class="num muted">' + pct(i.input_sec, i.duration_sec) + "%</td>" +
      "</tr>";
  }).join("");

  return "<section><h2>" + title + "</h2><table>" +
    '<tr><th></th><th class="num">Open</th><th class="num">Engaged</th></tr>' +
    rows + "</table></section>";
}

/* -- render ---------------------------------------------------------------- */

function render(data) {
  lastData = data;
  currentDay = data.day;
  el("day-label").textContent = data.is_today ? "Today" : longDate(data.day);

  // Pointed at the day on screen, not at today: the arrows are how you reach a
  // day worth sending, and the file that arrives should be the one you were
  // looking at when you clicked.
  el("download").href = "/api/day/" + data.day + "/pdf";
  el("download").setAttribute("download", "cadence-" + data.day + ".pdf");
  // Any day in the week identifies the week; the server works out the Monday,
  // and names the file after it in the Content-Disposition header.
  el("download-week").href = "/api/week/" + data.day + "/pdf";
  el("next").disabled = data.is_today;

  const s = data.summary;
  el("lede").innerHTML = s.sessions
    ? "<strong>" + s.sessions + "</strong> session" + (s.sessions > 1 ? "s" : "") +
      " &middot; <strong>" + fmt(s.blocks_sec) + "</strong> in blocks" +
      " &middot; longest <strong>" + fmt(s.longest_sec) + "</strong>"
    : "Nothing tracked on this day.";

  el("content").innerHTML =
    written(data.written, data.written_source) +
    timeline(data.sessions) +
    sessionTable(data.sessions) +
    categoryTable(data.categories) +
    appTable(data.apps) +
    listTable("Top sites", data.sites, function (x) { return x.host; }, false);

  history.replaceState(null, "", "?day=" + data.day);

  clearTimeout(timer);
  if (data.is_today) timer = setTimeout(function () { load(currentDay); }, POLL_MS);
}

async function load(day) {
  // Fetching and rendering are caught separately, because for one evening they
  // were not. A rendering bug in this file threw, the single catch below
  // reported it as "waiting for the tracker", and the tracker was running fine
  // the whole time -- the page accused the daemon of its own crash, and the
  // retry rethrew every five seconds forever. A message this reassuring has to
  // be earned: it may only be shown when the fetch itself failed.
  let data;
  try {
    let target = day;
    if (!target) {
      const days = await (await fetch("/api/days")).json();
      target = days.today;
    }
    data = await (await fetch("/api/day/" + target)).json();
  } catch (err) {
    // The page itself came from the service worker cache, which is why you are
    // reading this instead of a browser connection error.
    //
    // The wording is careful. This screen is what you get in the seconds after
    // logon before the tracker has started, and the version that said only
    // "can't reach the tracker" read as though the day had been lost -- it was
    // reported three times as "it lost everything" when nothing had been lost
    // at all. The database is only ever appended to; a tracker that is not
    // running records nothing new and destroys nothing old. Say that first.
    el("lede").textContent =
      "Waiting for the tracker. Nothing is lost — everything already recorded " +
      "is safe on this machine, and this page fills in by itself the moment " +
      "the tracker answers. It starts on its own shortly after you log in.";
    clearTimeout(timer);
    timer = setTimeout(function () { load(day); }, 5000);
    return;
  }

  try {
    render(data);
  } catch (err) {
    // The data arrived; we could not draw it. Say that, and say where to look,
    // rather than blaming the daemon that just answered.
    el("lede").textContent =
      "The tracker answered, but this page could not draw the result: " +
      err.message + " — the recording is unaffected.";
    throw err;   // and leave it in the console, with a stack
  }
}

function shift(days) {
  const parts = currentDay.split("-").map(Number);
  const moved = new Date(parts[0], parts[1] - 1, parts[2] + days);
  const iso = moved.getFullYear() + "-" +
    String(moved.getMonth() + 1).padStart(2, "0") + "-" +
    String(moved.getDate()).padStart(2, "0");
  load(iso);
}

// Delegated, because the table is rebuilt from scratch on every poll.
el("content").addEventListener("click", function (e) {
  const row = e.target.closest("tr.app");
  if (!row) return;

  const app = row.dataset.app;
  const isOpen = opened.has(app);
  if (isOpen) opened.delete(app); else opened.add(app);

  row.setAttribute("aria-expanded", String(!isOpen));
  const detail = el("content").querySelector('tr.detail[data-detail="' + CSS.escape(app) + '"]');
  if (detail) detail.hidden = isOpen;
});

el("prev").addEventListener("click", function () { shift(-1); });
el("next").addEventListener("click", function () { shift(1); });
document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "BUTTON") return;
  if (e.key === "ArrowLeft") shift(-1);
  if (e.key === "ArrowRight" && !el("next").disabled) shift(1);
});

el("download").innerHTML = DOWNLOAD;
el("download-week").innerHTML = WEEK;

load(currentDay);

// Registered so Chrome offers "Install app", which is what makes the dashboard
// pinnable to the taskbar with its own window and icon.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () { /* not fatal */ });
  });
}
</script>
</body>
